<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <defs>
    <!-- 風: 渦巻 -->
    <symbol id="sym-wind" viewBox="0 0 24 24">
      <path d="M12 20c-4.4 0-8-3.2-8-7.4C4 8.9 7 6 10.6 6c3 0 5.4 2.1 5.4 4.8 0 2.2-1.7 3.9-3.9 3.9-1.7 0-3-1.2-3-2.8 0-1.2.9-2.2 2.1-2.2"
        fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"/>
    </symbol>

    <!-- 根: 枝分かれする線 -->
    <symbol id="sym-root" viewBox="0 0 24 24">
      <path d="M12 21V11M12 11L6 4M12 11L18 4M12 15L7 15M12 15L17 15"
        fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>

    <!-- 花: 五枚の花びら -->
    <symbol id="sym-flower" viewBox="0 0 24 24">
      <g fill="currentColor">
        <ellipse cx="12" cy="6.6" rx="2.6" ry="4" transform="rotate(0 12 12)"/>
        <ellipse cx="12" cy="6.6" rx="2.6" ry="4" transform="rotate(72 12 12)"/>
        <ellipse cx="12" cy="6.6" rx="2.6" ry="4" transform="rotate(144 12 12)"/>
        <ellipse cx="12" cy="6.6" rx="2.6" ry="4" transform="rotate(216 12 12)"/>
        <ellipse cx="12" cy="6.6" rx="2.6" ry="4" transform="rotate(288 12 12)"/>
      </g>
      <circle cx="12" cy="12" r="2.1" fill="var(--badge, #F2F0EA)"/>
    </symbol>

    <!-- 葉: 葉脈のある一枚の葉 -->
    <symbol id="sym-leaf" viewBox="0 0 24 24">
      <path d="M12 3.5C17.5 5 20.5 9.5 19 15c-1.4 5-5.5 6-7 6-1.5 0-5.6-1-7-6C3.5 9.5 6.5 5 12 3.5Z"
        fill="currentColor"/>
      <path d="M12 5.5V20M12 9L9 11.5M12 12.5L9.3 15.2M12 16L9.7 18.2M12 9L15 11.5M12 12.5L14.7 15.2M12 16L14.3 18.2"
        fill="none" stroke="var(--badge, #F2F0EA)" stroke-width="0.9" stroke-linecap="round" opacity="0.8"/>
    </symbol>

    <!-- 水: しずく -->
    <symbol id="sym-drop" viewBox="0 0 24 24">
      <path d="M12 3.5c3.8 5 6.5 8.7 6.5 11.9a6.5 6.5 0 0 1-13 0c0-3.2 2.7-6.9 6.5-11.9Z" fill="currentColor"/>
    </symbol>

    <!-- 木の実: どんぐり -->
    <symbol id="sym-acorn" viewBox="0 0 24 24">
      <path d="M8.5 11.5c0-2.6 1.6-4 3.5-4s3.5 1.4 3.5 4c0 4.4-1.7 8-3.5 8s-3.5-3.6-3.5-8Z" fill="currentColor"/>
      <path d="M7.3 11.3c0-2.3 2.1-4.1 4.7-4.1s4.7 1.8 4.7 4.1c-1.4-.7-3-1.1-4.7-1.1s-3.3.4-4.7 1.1Z" fill="currentColor" opacity="0.6"/>
      <path d="M12 7.2V5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
    </symbol>

    <!-- 茸: かさの形 -->
    <symbol id="sym-mushroom" viewBox="0 0 24 24">
      <path d="M4 12.5c0-4.7 3.6-7.5 8-7.5s8 2.8 8 7.5Z" fill="currentColor"/>
      <rect x="10" y="12.5" width="4" height="6" rx="1.3" fill="currentColor"/>
      <circle cx="9" cy="9" r="1" fill="var(--badge, #F2F0EA)" opacity="0.7"/>
      <circle cx="14.5" cy="8.3" r="0.8" fill="var(--badge, #F2F0EA)" opacity="0.7"/>
    </symbol>

    <!-- 岩: 六角形 -->
    <symbol id="sym-hex" viewBox="0 0 24 24">
      <polygon points="12,3.5 19,7.8 19,16.2 12,20.5 5,16.2 5,7.8" fill="currentColor"/>
    </symbol>

    <!-- 苔: 三つの丸の集まり -->
    <symbol id="sym-moss" viewBox="0 0 24 24">
      <circle cx="9" cy="9.5" r="4" fill="currentColor"/>
      <circle cx="15.5" cy="10.5" r="3.2" fill="currentColor"/>
      <circle cx="11.5" cy="16" r="3" fill="currentColor"/>
    </symbol>

    <!-- 太陽: とげのある円 -->
    <symbol id="sym-sun" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="4.6" fill="currentColor"/>
      <g stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M12 3v2.4M12 18.6V21M21 12h-2.4M5.4 12H3M18.1 5.9l-1.7 1.7M7.6 16.5l-1.7 1.7M18.1 18.1l-1.7-1.7M7.6 7.5 5.9 5.9"/>
      </g>
    </symbol>

    <!-- 月: 三日月 -->
    <symbol id="sym-moon" viewBox="0 0 24 24">
      <path d="M15.5 4.2A8.5 8.5 0 1 0 15.5 19.8 7 7 0 0 1 15.5 4.2Z" fill="currentColor"/>
    </symbol>

    <!-- 火: 炎 -->
    <symbol id="sym-fire" viewBox="0 0 24 24">
      <path d="M12 2.8c1 2.4 3.9 4.2 3.9 8 0 3.8-2.6 6.4-5.9 6.4S4 14.6 4 10.8c0-1.4.6-2.6 1.4-3.5-.1 1.2.4 2 1.1 2.4-.3-2.2.3-4.6 1.7-7 .4 1.8 1.3 2.8 2.2 3.1-.3-1.1-.2-2.2.5-3Z"
        fill="currentColor"/>
    </symbol>

    <!-- ＋: 恩恵の加点 -->
    <symbol id="sym-plus" viewBox="0 0 24 24">
      <path d="M11 4h2v7h7v2h-7v7h-2v-7H4v-2h7z" fill="currentColor"/>
    </symbol>
  </defs>
</svg>
